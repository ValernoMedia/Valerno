<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0e0c;
    color: #f0ebe2;
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 60px;
    text-decoration: none;
    color: #f0ebe2;
  }
  .logo span { color: #b8892a; }
  .check {
    width: 64px; height: 64px;
    border: 1px solid #b8892a;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 32px;
    font-size: 24px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 52px;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  h1 em { font-style: italic; color: #b8892a; }
  p {
    font-size: 15px;
    color: rgba(240,235,226,0.5);
    font-weight: 300;
    line-height: 1.8;
    max-width: 400px;
    margin: 0 auto 40px;
  }
  a.btn {
    display: inline-block;
    border: 1px solid rgba(240,235,226,0.2);
    color: rgba(240,235,226,0.6);
    padding: 14px 32px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    font-weight: 500;
    transition: all .2s;
  }
  a.btn:hover { border-color: #f0ebe2; color: #f0ebe2; }
</style>

<body>
  <a href="index.html" class="logo">Valerno<span>.</span></a>
  <div class="check">✓</div>
  <h1>Message <em>received.</em></h1>
